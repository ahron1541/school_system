[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
upload_speed = 115200
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
build_flags = -DNFC_INTERFACE_HSU
lib_deps =
    https://github.com/Seeed-Studio/PN532.git#2c47f5c
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit NeoPixel@1.15.5
    arduino-libraries/Ethernet@2.0.2
    bblanchon/ArduinoJson@7.4.3
