[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<*> -<diagnostics/>

monitor_speed = 115200
monitor_echo = no
monitor_eol = LF
monitor_filters = send_on_enter
upload_speed = 115200

board_upload.before_reset = no_reset
board_upload.after_reset = no_reset

build_flags =
    -DNFC_INTERFACE_HSU

lib_deps =
    https://github.com/Seeed-Studio/PN532.git
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit NeoPixel
    arduino-libraries/Ethernet
    arduino-libraries/ArduinoHttpClient@0.6.1
    bblanchon/ArduinoJson@7.4.3

; Standalone Step 1 test for the verified UART wiring. No Ethernet or API traffic.
[env:uid_serial]
extends = env:esp32dev
build_src_filter = -<*> +<diagnostics/uid_serial.cpp>
lib_deps =
    https://github.com/Seeed-Studio/PN532.git#2c47f5c
    adafruit/Adafruit NeoPixel@1.15.5
